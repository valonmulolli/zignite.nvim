name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lua Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4"

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      - name: Lua syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for file in $(git ls-files '*.lua'); do
            luac -p "$file"
          done

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          lua test/runner.lua

      - name: Build Zig backend
        shell: bash
        run: |
          set -euo pipefail
          cd zig
          zig build
          zig build test

      - name: Benchmark smoke
        shell: bash
        run: |
          set -euo pipefail
          lua test/benchmark.lua 3000
