name: CI

on:
  push:
  pull_request:

jobs:
  zig:
    name: Zig (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Zig 0.16.0
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run Windows process tests
        if: matrix.os == 'windows-latest'
        working-directory: zig
        run: zig test src/command.zig --test-filter "windows timeout coordinator terminates descendants"

      - name: Run Windows Zig project tests
        if: matrix.os == 'windows-latest'
        working-directory: zig
        run: zig test tests.zig --test-filter "detectSteps"

      - name: Run Debug tests
        working-directory: zig
        run: zig build test -Doptimize=Debug

      - name: Build ReleaseFast
        working-directory: zig
        run: zig build -Doptimize=ReleaseFast

  lua:
    name: Lua integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4 lua-dkjson

      - name: Run Lua and integration tests
        env:
          ZIGNITE_LUA: lua5.4
        run: lua5.4 zig/test/runner.lua .
