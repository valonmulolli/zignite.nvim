name: CI

on:
  push:
  pull_request:

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject generated artifacts
        run: |
          if git ls-files | grep -E '(^|/)(target|\.zig-cache|\.zignite-zig-cache|zig-cache|zig-out)(/|$)' >/dev/null; then
            echo "Generated build artifacts must not be tracked:"
            git ls-files | grep -E '(^|/)(target|\.zig-cache|\.zignite-zig-cache|zig-cache|zig-out)(/|$)'
            exit 1
          fi

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run tests
        run: cargo test --manifest-path rust/Cargo.toml --all-targets --locked

      - name: Build release
        run: cargo build --manifest-path rust/Cargo.toml --release --locked

      - name: Check formatting and lints
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings

  lua:
    name: Lua integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4 lua-dkjson

      - name: Run Lua and integration tests
        env:
          ZIGNITE_LUA: lua5.4
        run: lua5.4 zig/test/runner.lua .
